name = "PrimeGapsIntegration"
version = "0.2.0"
defaultTargets = ["Submission"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/kimihiro64/PrimeNumberTheoremAnd.git"
rev = "0f15a38c619298b5cd786d39a84dd4bb8997324c"

# The verifier's prime-gaps profile (bigospeedrun/verifier, profiles/direct.json)
# stages source_roots = ["Submission"] with solution_module = "Submission": every
# Lean module of this proof lives under Submission/ and its imports name
# Submission.*. A single library with default roots ["Submission"] builds
# Submission.lean and, transitively, every module it imports — the same set the
# seven per-root libraries built before the re-cut, including the three vendored
# Robin1984.Xi modules used by the Bombieri-Vinogradov solution.
[[lean_lib]]
name = "Submission"
